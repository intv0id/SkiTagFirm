name: Create Release

on:
  push:
    branches: [ main ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases and tags

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Fetch all history for git tag checks

    - name: Extract version from CMakeLists.txt
      id: get_version
      run: |
        VERSION=$(grep -oP 'project\\(skitag_firmware VERSION \\K[0-9]+\\.[0-9]+\\.[0-9]+' CMakeLists.txt)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV

    - name: Check if tag exists
      id: check_tag
      run: |
        if git rev-parse "${{ env.TAG_NAME }}" >/dev/null 2>&1; then
          echo "Tag ${{ env.TAG_NAME }} already exists. Skipping release."
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "Tag ${{ env.TAG_NAME }} does not exist. Proceeding with release."
          echo "skip=false" >> $GITHUB_OUTPUT
        fi

    - name: Install dependencies
      if: steps.check_tag.outputs.skip == 'false'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

    - name: Set up Pico SDK
      if: steps.check_tag.outputs.skip == 'false'
      run: |
        git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git ${{ github.workspace }}/pico-sdk
        export PICO_SDK_PATH=${{ github.workspace }}/pico-sdk

    - name: Build firmware
      if: steps.check_tag.outputs.skip == 'false'
      run: |
        mkdir build
        cd build
        export PICO_SDK_PATH=${{ github.workspace }}/pico-sdk
        cmake ..
        make

    - name: Create Git Tag
      if: steps.check_tag.outputs.skip == 'false'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git tag "${{ env.TAG_NAME }}" -a -m "Release ${{ env.TAG_NAME }}"
        git push origin "${{ env.TAG_NAME }}"

    - name: Create Release
      if: steps.check_tag.outputs.skip == 'false'
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TAG_NAME }}
        release_name: Release ${{ env.TAG_NAME }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      if: steps.check_tag.outputs.skip == 'false'
      id: upload-release-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./build/skitag_firmware.uf2
        asset_name: skitag_firmware.uf2
        asset_content_type: application/octet-stream
